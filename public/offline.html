<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>אין חיבור — רותם עדני</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #fff; color: #1c1c1e; text-align: center; }
      @media (prefers-color-scheme: dark) { body { background: #000; color: #fff; } }
      main { display: grid; gap: 14px; justify-items: center; max-width: 360px; }
      img { width: 96px; height: 96px; }
      h1 { margin: 0; font-size: 1.4rem; }
      p { margin: 0; color: #6e6e73; line-height: 1.5; }
      button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 12px; background: #8b6b43; color: #fff; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="./icons/icon-192.png" alt="רותם עדני" />
      <h1>אין חיבור לאינטרנט</h1>
      <p>נראה שהמכשיר לא מחובר. היומן יחזור לפעול מיד כשהחיבור יחזור.</p>
      <button type="button" onclick="location.reload()">נסו שוב</button>
    </main>
  </body>
</html>
